<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Magic 8 Ball</title>
</head>
<body class = "min-h-[786px] bg-linear-to-b from-cyan-100 to bg-cyan-600">

    <header class="flex items-center justify-between">

        <a href="index.html" class="font-bold text-slate-800 hover:text-slate-600">Home</a>
    </header>
 
 <form id="magic-form">
       <input id="magic-input" type="text" placeholder="Ask a question..." class="bg-linear-to-b from-cyan-100 to bg-cyan-200 text-slate-800 font-bold py-2 px-4 rounded border border-slate-800 mt-4" required/>
    <button id="magic-button" type="submit" class= "bg-linear-to-b from-cyan-100 to bg-cyan-600 hover:bg-blue-700  text-slate-800 font-bold py-2 px-4 rounded border border-slate-800">Shake the 8 Ball</button>
 </form>

 <p id="magic-text" class="text-lg font-medium">Reveal your future...</p>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Greater Than or Less Than</title>
</head>
<body class = "min-h-[786px] bg-linear-to-b from-cyan-100 to bg-cyan-600">

     <header class="flex items-center justify-between">
        <h1 class="text-3xl font-bold text-slate-800">Mini Challenges</h1>
        <a href="index.html" class="font-bold text-slate-800 hover:text-slate-600">Home</a>
    </header>
 
    

    <form id="greater-than-form">
        <input type="number" id="numOne-input" placeholder="Enter first number" required class="bg-linear-to-b from-cyan-100 to bg-cyan-200 text-slate-800 font-bold py-2 px-4 rounded border border-slate-800 mt-4" required>
        <input type="number" id="numTwo-input" placeholder="Enter second number" required class="bg-linear-to-b from-cyan-100 to bg-cyan-200 text-slate-800 font-bold py-2 px-4 rounded border border-slate-800 mt-4" required>
        <button id="greaterThan" type="submit" class= "bg-linear-to-b from-cyan-100 to bg-cyan-600 hover:bg-blue-700  text-slate-800 font-bold py-2 px-4 rounded border border-slate-800">Compare Numbers</button>
    </form>

<p id="greater-than-result" class="whitespace-pre-line text-lg font-medium">Result will be displayed here.</p>
<script src = "js/app.js"></script>
</body>
</html>
